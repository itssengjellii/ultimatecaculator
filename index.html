<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator · Ultimate Calculator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f6bff'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif'>∑</text></svg>">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/calculator.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="calculator">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topbar glass">
  <a class="brand" href="index.html"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#4f6bff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><rect x="7" y="6" width="18" height="6" rx="2" fill="#fff" opacity=".95"/><g fill="#fff" opacity=".85"><circle cx="10" cy="17" r="1.8"/><circle cx="16" cy="17" r="1.8"/><circle cx="22" cy="17" r="1.8"/><circle cx="10" cy="23" r="1.8"/><circle cx="16" cy="23" r="1.8"/><circle cx="22" cy="23" r="1.8"/></g></svg><span>Ultimate Calculator</span></a>
  <nav class="nav" aria-label="Main"><a href="index.html" data-nav="calculator">Calculator</a><a href="history.html" data-nav="history">History</a><a href="guide.html" data-nav="guide">Guide</a><a href="settings.html" data-nav="settings">Settings</a></nav>
  <div class="actions">
    <button class="icon-btn" id="historyToggle" aria-label="Show history" title="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg></button>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24" id="themeIcon"></svg></button>
  </div>
</header>
<main class="layout">
  <section class="calc glass" id="calc" data-mode="standard">
    <div class="device"><span>Ultimate <b>Σ</b> Advanced Math Engine</span><i class="solar" aria-hidden="true"></i></div>
    <div class="display">
      <div class="chips">
        <div class="seg" role="group" aria-label="Calculator mode">
          <button data-mode="standard" class="on">Standard</button>
          <button data-mode="scientific">Scientific</button>
        </div>
        <span class="spacer"></span>
        <button class="chip" id="angleChip" title="Toggle degrees / radians">DEG</button>
        <button class="chip" id="fracChip" title="Show results as fractions" aria-pressed="false">Fraction</button>
        <button class="chip" id="copyBtn" title="Copy result">Copy</button>
      </div>
      <div class="expr" id="exprLine"></div>
      <div class="result" id="resultLine" aria-live="polite">0</div>
    </div>

    <div class="keys" id="keys">
      <div class="pad sci" id="sciPad">
        <button class="key fn" data-ins="sin(">sin</button>
        <button class="key fn" data-ins="cos(">cos</button>
        <button class="key fn" data-ins="tan(">tan</button>
        <button class="key fn" data-ins="π">π</button>
        <button class="key fn" data-ins="asin(" aria-label="inverse sine">sin⁻¹</button>
        <button class="key fn" data-ins="acos(" aria-label="inverse cosine">cos⁻¹</button>
        <button class="key fn" data-ins="atan(" aria-label="inverse tangent">tan⁻¹</button>
        <button class="key fn" data-ins="e">e</button>
        <button class="key fn" data-ins="√(" aria-label="square root">√x</button>
        <button class="key fn" data-ins="∛(" aria-label="cube root">∛x</button>
        <button class="key fn" data-ins="^2" aria-label="square">x²</button>
        <button class="key fn" data-ins="^" aria-label="power">xʸ</button>
        <button class="key fn" data-ins="log(">log</button>
        <button class="key fn" data-ins="ln(">ln</button>
        <button class="key fn" data-ins="!" aria-label="factorial">n!</button>
        <button class="key fn" data-ins="abs(" aria-label="absolute value">|x|</button>
        <button class="key fn" data-ins="E" aria-label="scientific notation">EE</button>
        <button class="key fn" data-ins="^(−1)" aria-label="reciprocal">x⁻¹</button>
        <button class="key fn" data-ins="10^" aria-label="ten to the power">10ˣ</button>
        <button class="key fn" data-ins="e^" aria-label="e to the power">eˣ</button>
      </div>
      <div class="pad main">
        <button class="key ctl" data-act="clear" aria-label="All clear">AC</button>
        <button class="key ctl" data-act="del" aria-label="Delete">⌫</button>
        <button class="key op" data-ins="(">(</button>
        <button class="key op" data-ins=")">)</button>
        <button class="key" data-ins="7">7</button>
        <button class="key" data-ins="8">8</button>
        <button class="key" data-ins="9">9</button>
        <button class="key op" data-ins="÷" aria-label="divide">÷</button>
        <button class="key" data-ins="4">4</button>
        <button class="key" data-ins="5">5</button>
        <button class="key" data-ins="6">6</button>
        <button class="key op" data-ins="×" aria-label="multiply">×</button>
        <button class="key" data-ins="1">1</button>
        <button class="key" data-ins="2">2</button>
        <button class="key" data-ins="3">3</button>
        <button class="key op" data-ins="−" aria-label="subtract">−</button>
        <button class="key" data-ins="0">0</button>
        <button class="key" data-ins=".">.</button>
        <button class="key op" data-ins="%" aria-label="percent">%</button>
        <button class="key op" data-ins="+" aria-label="add">+</button>
        <button class="key fn" data-act="neg" aria-label="Toggle sign">±</button>
        <button class="key fn" data-ins="Ans">Ans</button>
        <button class="key eq" data-act="eq" aria-label="Equals">=</button>
      </div>
    </div>
  </section>

  <aside class="history glass" id="historyPanel" aria-label="Calculation history">
    <div class="h-head">
      <h2>History</h2>
      <a class="chip" href="history.html">View all</a>
      <button class="chip" id="clearHistory">Clear all</button>
      <button class="icon-btn small close-h" id="closeHistory" aria-label="Close history"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ul id="historyList"></ul>
  </aside>
</main>
<footer class="foot">Every calculation runs locally in your browser. Nothing is sent anywhere.</footer>
<div class="toast" id="toast" role="status"></div>
<script src="js/engine.js"></script>
<script src="js/shared.js"></script>
<script src="js/app.js"></script>
</body>
</html>
